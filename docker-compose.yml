services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yumify-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client-side
      dockerfile: Dockerfile
    container_name: yumify-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
